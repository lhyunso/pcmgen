name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview>=4.0 openpyxl>=3.1.0 pythonnet clr-loader

      - name: Build EXE
        run: python build.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PCM_Generator_Windows
          path: dist/PCM_Generator.exe
          retention-days: 90
